name: Auto Update Stock Data to Google Sheets

on:
  schedule:
    # Chạy tự động vào lúc 15:10 chiều giờ Việt Nam (08:10 UTC) từ Thứ 2 đến Thứ 6
    - cron: '10 8 * * 1-5'
  
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn từ GitHub
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện
        run: pip install -r requirements.txt

      - name: Tạo file chứng thực Google API
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "$GCP_CREDENTIALS" > credentials.json

      - name: Chạy script cập nhật dữ liệu
        run: python auto_update.py
